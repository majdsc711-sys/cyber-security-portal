<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050914">
  <title>اضغط</title>
  <style>
    :root{color-scheme:dark;--cyan:#70f5ed;--blue:#628aff;--violet:#a887ff}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{background:#050914;color:#eaffff;font-family:Tahoma,"Segoe UI",Arial,sans-serif}
    body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none}
    body::before{z-index:-2;background:radial-gradient(ellipse at 50% 43%,rgba(34,100,150,.22),transparent 27%),radial-gradient(ellipse at 50% 50%,rgba(69,44,146,.17),transparent 48%),radial-gradient(ellipse at 50% 110%,rgba(15,61,91,.24),transparent 54%),#050914}
    body::after{z-index:-1;opacity:.23;background-image:radial-gradient(1px 1px at 12% 21%,#d7ffff 98%,transparent),radial-gradient(1px 1px at 83% 18%,#7f9bff 98%,transparent),radial-gradient(1.5px 1.5px at 71% 71%,#9afff4 98%,transparent),radial-gradient(1px 1px at 24% 77%,#b7a0ff 98%,transparent),radial-gradient(1px 1px at 91% 53%,#e8ffff 98%,transparent),radial-gradient(1px 1px at 42% 13%,#b7d6ff 98%,transparent);background-size:280px 260px;animation:stars 18s linear infinite}
    @keyframes stars{to{background-position:280px 260px}}
    .stage{width:100%;height:100%;min-height:100svh;display:grid;place-items:center;perspective:1100px;isolation:isolate}
    .portal{position:relative;width:min(82vw,390px);height:min(82vw,390px);display:grid;place-items:center;text-decoration:none;color:#efffff;outline:none;transform-style:preserve-3d;-webkit-tap-highlight-color:transparent}
    .portal::before{content:"";position:absolute;inset:7%;border:1px solid rgba(112,245,237,.43);border-radius:50%;transform:rotateX(68deg) rotateZ(-12deg);box-shadow:0 0 24px rgba(86,202,255,.13),inset 0 0 22px rgba(104,135,255,.11);animation:orbit 12s linear infinite;pointer-events:none}
    .portal::after{content:"";position:absolute;width:70%;height:18%;bottom:16%;left:15%;border-radius:50%;background:rgba(41,155,196,.22);filter:blur(31px);transform:translateZ(-55px);animation:shadow 5s ease-in-out infinite;pointer-events:none}
    .emblem{position:relative;z-index:1;width:min(48vw,232px);height:auto;max-height:64%;object-fit:contain;transform-style:preserve-3d;filter:drop-shadow(0 0 13px rgba(89,223,241,.22)) drop-shadow(0 20px 27px rgba(0,0,0,.48));animation:float 5.6s ease-in-out infinite;transition:filter .3s,transform .3s}
    .label{position:absolute;z-index:2;bottom:5%;min-width:116px;padding:11px 25px;border:1px solid rgba(112,245,237,.62);border-radius:999px;background:linear-gradient(135deg,rgba(11,37,53,.84),rgba(27,23,66,.88));color:#eaffff;font-size:17px;font-weight:700;letter-spacing:.3px;text-align:center;box-shadow:0 0 19px rgba(72,218,224,.21),inset 0 0 13px rgba(91,157,255,.13);backdrop-filter:blur(8px);transform:translateZ(40px);transition:box-shadow .25s,border-color .25s,transform .25s}
    .portal:hover .emblem,.portal:focus-visible .emblem{filter:drop-shadow(0 0 23px rgba(89,239,232,.42)) drop-shadow(0 22px 31px rgba(0,0,0,.52));transform:translateY(-5px) rotateY(-9deg) rotateX(4deg) translateZ(22px)}
    .portal:hover .label,.portal:focus-visible .label{border-color:#b2fffa;box-shadow:0 0 30px rgba(72,218,224,.43),inset 0 0 15px rgba(91,157,255,.19);transform:translateY(-3px) translateZ(45px)}
    .portal:focus-visible{outline:2px solid rgba(112,245,237,.55);outline-offset:8px;border-radius:50%}
    @keyframes orbit{from{transform:rotateX(68deg) rotateZ(-12deg)}to{transform:rotateX(68deg) rotateZ(348deg)}}
    @keyframes float{0%,100%{transform:translateY(4px) rotateY(-7deg) rotateX(3deg) translateZ(15px)}50%{transform:translateY(-11px) rotateY(8deg) rotateX(-2deg) translateZ(28px)}}
    @keyframes shadow{0%,100%{opacity:.55;transform:translateZ(-55px) scale(.92)}50%{opacity:.9;transform:translateZ(-55px) scale(1.08)}}
    @media(max-width:480px){.portal{width:min(92vw,350px);height:min(92vw,350px)}.emblem{width:min(58vw,205px)}.label{bottom:3%;font-size:16px;padding:10px 23px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="stage">
    <a class="portal" href="https://drive.google.com/drive/folders/18sUd4ecK3dTLwVIOfs7NiKwjT1Qz01pP" target="_blank" rel="noopener noreferrer" aria-label="اضغط">
      <img class="emblem" src="emblem.png" alt="">
      <span class="label">اضغط</span>
    </a>
  </main>
</body>
</html>
