<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111b">
  <title>بوابة الأمن السيبراني | majdsc</title>
  <style>
    :root{color-scheme:dark;--ice:#dffcff;--mint:#62efe2;--aqua:#00c6d8;--blue:#637dff;--violet:#a467ff}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{overflow:hidden;background:#07111b;color:var(--ice);font-family:Tahoma,"Segoe UI",Arial,sans-serif}
    .backdrop{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#153444 0%,#0c1c2a 39%,#07111b 76%)}
    .backdrop::before,.backdrop::after{content:"";position:absolute;pointer-events:none;border-radius:50%;filter:blur(1px)}
    .backdrop::before{width:min(78vw,900px);height:min(78vw,900px);left:50%;top:47%;transform:translate(-50%,-50%);border:1px solid rgba(111,233,239,.09);box-shadow:0 0 70px rgba(30,184,205,.07),inset 0 0 75px rgba(115,119,255,.04)}
    .backdrop::after{inset:-35%;background:conic-gradient(from 15deg at 50% 50%,transparent 0 34%,rgba(35,212,224,.09) 42%,transparent 51% 70%,rgba(154,106,255,.08) 79%,transparent 88%);filter:blur(76px);animation:ambient 30s linear infinite}
    .watermark{position:absolute;z-index:1;left:50%;top:48%;width:min(91vw,1040px);height:100svh;object-fit:contain;opacity:.2;pointer-events:none;user-select:none;transform:translate(-50%,-50%) translateZ(-70px);filter:saturate(1.4) drop-shadow(0 0 42px rgba(41,221,227,.2));animation:watermarkFloat 11s ease-in-out infinite,logoColor 20s linear infinite}
    main{position:relative;z-index:2;min-height:100svh;width:100%;display:grid;place-items:center;padding:24px 18px calc(58px + env(safe-area-inset-bottom));perspective:1400px}
    .stage{width:min(92vw,450px);animation:stageFloat 7s ease-in-out infinite;transform-style:preserve-3d}
    .profile-card{--tilt-x:0deg;--tilt-y:0deg;position:relative;min-height:min(610px,78svh);width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:27px;padding:40px 28px;border:1px solid rgba(201,247,255,.33);border-radius:34px;background:linear-gradient(155deg,rgba(19,39,55,.75),rgba(11,21,39,.72));box-shadow:0 34px 100px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.17),0 0 54px rgba(52,200,218,.11);backdrop-filter:blur(18px) saturate(128%);-webkit-backdrop-filter:blur(18px) saturate(128%);transform-style:preserve-3d;transform:rotateX(var(--tilt-x)) rotateY(var(--tilt-y));transition:transform .22s ease,border-color .3s,box-shadow .3s}
    .profile-card::before{content:"";position:absolute;inset:1px;border-radius:33px;padding:1px;background:linear-gradient(145deg,rgba(119,255,239,.54),transparent 32%,rgba(132,124,255,.29) 70%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    .avatar-ring{position:relative;width:174px;height:174px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(17,33,51,.35) 45%,rgba(81,211,222,.12) 70%,transparent 72%);box-shadow:0 0 46px rgba(37,218,221,.19),inset 0 0 24px rgba(174,138,255,.12);transform:translateZ(72px)}
    .avatar-ring::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1px solid rgba(158,247,250,.42);box-shadow:0 0 21px rgba(66,225,232,.19)}
    .avatar{width:144px;height:144px;object-fit:contain;filter:saturate(1.4) drop-shadow(0 10px 20px rgba(0,0,0,.28));animation:avatarColor 19s linear infinite,avatarBob 6s ease-in-out infinite;user-select:none;pointer-events:none}
    h1{position:relative;z-index:1;margin:0;color:#f2feff;font-size:clamp(23px,5vw,30px);font-weight:800;line-height:1.5;text-align:center;letter-spacing:.1px;text-shadow:0 3px 18px rgba(0,0,0,.68),0 0 25px rgba(91,223,226,.18);transform:translateZ(54px)}
    .cta{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:12px;width:min(100%,340px);min-height:64px;padding:15px 24px;overflow:hidden;border:1px solid rgba(221,255,252,.7);border-radius:999px;background:linear-gradient(112deg,#10a5ad 0%,#3979d8 51%,#8a58d1 100%);box-shadow:0 13px 34px rgba(30,189,208,.28),inset 0 1px rgba(255,255,255,.42);color:#fff;font-size:clamp(18px,4.5vw,22px);font-weight:800;line-height:1.4;text-align:center;text-decoration:none;text-shadow:0 2px 9px rgba(0,0,0,.32);transform:translateZ(68px);transition:transform .24s,box-shadow .24s,filter .24s}
    .cta::before{content:"";position:absolute;z-index:-1;inset:-70% -35%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.4) 50%,transparent 58%);transform:translateX(-70%);transition:transform .7s ease}
    .cta:hover,.cta:focus-visible{transform:translateY(-5px) translateZ(76px) scale(1.035);box-shadow:0 20px 48px rgba(40,203,224,.4),0 0 28px rgba(149,121,255,.28),inset 0 1px rgba(255,255,255,.5);filter:saturate(1.18)}
    .cta:hover::before,.cta:focus-visible::before{transform:translateX(70%)}
    .cta:focus-visible{outline:2px solid #c3fffa;outline-offset:6px}
    .emoji{font-size:1.08em;filter:drop-shadow(0 2px 5px rgba(0,0,0,.25))}
    .signature{position:fixed;z-index:3;right:0;bottom:calc(14px + env(safe-area-inset-bottom));left:0;margin:0;color:rgba(220,244,249,.63);font-size:13px;letter-spacing:.7px;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.62)}
    @keyframes stageFloat{0%,100%{transform:translateY(3px)}50%{transform:translateY(-7px)}}
    @keyframes avatarBob{0%,100%{transform:translateY(0) translateZ(0)}50%{transform:translateY(-5px) translateZ(8px)}}
    @keyframes avatarColor{0%,100%{filter:hue-rotate(0deg) saturate(1.35) drop-shadow(0 10px 20px rgba(0,0,0,.25))}33%{filter:hue-rotate(105deg) saturate(1.45) drop-shadow(0 0 22px rgba(62,190,255,.34))}66%{filter:hue-rotate(235deg) saturate(1.4) drop-shadow(0 0 24px rgba(177,117,255,.35))}}
    @keyframes watermarkFloat{0%,100%{transform:translate(-50%,-50%) translateZ(-70px) rotateY(-5deg) rotateX(2deg) scale(1)}50%{transform:translate(-50%,-51%) translateZ(-50px) rotateY(5deg) rotateX(-2deg) scale(1.03)}}
    @keyframes logoColor{0%,100%{filter:hue-rotate(0deg) saturate(1.4) drop-shadow(0 0 42px rgba(41,221,227,.2))}35%{filter:hue-rotate(120deg) saturate(1.5) drop-shadow(0 0 46px rgba(81,153,255,.23))}70%{filter:hue-rotate(250deg) saturate(1.5) drop-shadow(0 0 44px rgba(180,108,255,.22))}}
    @keyframes ambient{to{transform:rotate(360deg)}}
    @media(max-width:560px){.watermark{width:100vw;height:91svh;top:47%;opacity:.23}.stage{width:min(90vw,390px)}.profile-card{min-height:min(560px,76svh);gap:23px;padding:30px 22px;border-radius:30px}.profile-card::before{border-radius:29px}.avatar-ring{width:150px;height:150px}.avatar{width:124px;height:124px}.cta{min-height:60px;padding:14px 20px}.signature{font-size:12px}}
    @media(max-height:680px){.profile-card{min-height:490px;gap:18px;padding:22px}.avatar-ring{width:132px;height:132px}.avatar{width:108px;height:108px}.stage{width:min(88vw,420px)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <img class="watermark" src="emblem.png" alt="">
  </div>
  <main>
    <div class="stage">
      <section class="profile-card" id="profile-card">
        <div class="avatar-ring"><img class="avatar" src="emblem.png" alt=""></div>
        <h1>للانتقال اضغط</h1>
        <a class="cta" href="https://drive.google.com/drive/folders/18sUd4ecK3dTLwVIOfs7NiKwjT1Qz01pP" target="_blank" rel="noopener noreferrer">
          <span>انتقل إلى المحاضرات</span><span class="emoji" aria-hidden="true">📚</span>
        </a>
      </section>
    </div>
    <p class="signature">majdsc</p>
  </main>
  <script>
    const card=document.getElementById('profile-card');
    const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(card&&!reduceMotion&&window.matchMedia('(pointer:fine)').matches){
      card.addEventListener('pointermove',event=>{
        const bounds=card.getBoundingClientRect();
        const x=(event.clientX-bounds.left)/bounds.width-.5;
        const y=(event.clientY-bounds.top)/bounds.height-.5;
        card.style.setProperty('--tilt-x',`${(-y*7).toFixed(2)}deg`);
        card.style.setProperty('--tilt-y',`${(x*8).toFixed(2)}deg`);
      });
      card.addEventListener('pointerleave',()=>{
        card.style.setProperty('--tilt-x','0deg');
        card.style.setProperty('--tilt-y','0deg');
      });
    }
  </script>
</body>
</html>
