<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07121a">
  <title>اضغط على هذا الرابط للتوجه إلى مكتبة الموارد</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{overflow:hidden;background:#07121a;color:#efffff;font-family:Tahoma,"Segoe UI",Arial,sans-serif}
    main{width:100%;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px;perspective:1100px}
    .emblem{display:block;width:min(72vw,430px);height:auto;max-height:70svh;object-fit:contain;transform-style:preserve-3d;filter:drop-shadow(0 22px 28px rgba(0,0,0,.34));animation:float3d 7s ease-in-out infinite;transition:filter .25s,transform .25s}
    a{display:inline-block;color:#f0ffff;font-size:clamp(18px,3vw,25px);font-weight:700;line-height:1.55;text-align:center;text-decoration:underline;text-decoration-color:rgba(111,232,225,.72);text-decoration-thickness:1px;text-underline-offset:7px;transition:color .2s,text-shadow .2s,transform .2s}
    a:hover,a:focus-visible{color:#80f2e9;text-shadow:0 0 20px rgba(94,226,221,.42);transform:translateY(-2px)}
    a:focus-visible{outline:2px solid rgba(128,242,233,.65);outline-offset:9px;border-radius:4px}
    a:hover .emblem,a:focus-visible .emblem{filter:drop-shadow(0 28px 34px rgba(30,190,192,.2));transform:rotateY(-5deg) rotateX(3deg) translateZ(18px)}
    @keyframes float3d{0%,100%{transform:rotateY(-4deg) rotateX(2deg) translateY(3px) translateZ(8px)}50%{transform:rotateY(5deg) rotateX(-2deg) translateY(-9px) translateZ(22px)}}
    @media(max-width:520px){main{gap:22px}.emblem{width:min(82vw,360px);max-height:66svh}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main>
    <a href="https://drive.google.com/drive/folders/18sUd4ecK3dTLwVIOfs7NiKwjT1Qz01pP" target="_blank" rel="noopener noreferrer"> <img class="emblem" src="emblem.png" alt="">اضغط على هذا الرابط للتوجه إلى مكتبة الموارد</a>
  </main>
</body>
</html>
