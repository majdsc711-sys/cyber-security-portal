<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self'; style-src 'self'; script-src 'none'; connect-src 'none'; font-src 'self'; object-src 'none'; media-src 'none'; worker-src 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#070914">
  <meta name="description" content="بوابة الوصول إلى محاضرات الأمن السيبراني.">
  <title>بوابة الأمن السيبراني | m.j.d</title>
  <link rel="stylesheet" href="styles.css?v=abstract-portal-1">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient__grid"></div>
    <div class="ambient__glow ambient__glow--blue"></div>
    <div class="ambient__glow ambient__glow--violet"></div>
    <div class="ambient__scan"></div>
  </div>

  <main class="portal">
    <section class="hero" aria-labelledby="portal-title">
      <div class="emblem-scene" aria-hidden="true">
        <div class="scene-aura"></div>
        <div class="orbit orbit--one"><span></span></div>
        <div class="orbit orbit--two"><span></span></div>
        <div class="orbit orbit--three"><span></span></div>
        <div class="emblem-core">
          <div class="core-glint"></div>
          <img src="emblem.png" alt="">
        </div>
        <div class="orbit-floor"></div>
      </div>

      <div class="portal-card">
        <p class="eyebrow"><span class="eyebrow-dot"></span> بوابة الأمن السيبراني</p>
        <h1 id="portal-title">معرفتك هي <span>خط الدفاع الأول</span></h1>
        <p class="subtitle">محاضرات الأمن السيبراني بين يديك.</p>
        <a class="lecture-link" href="https://drive.google.com/drive/folders/18sUd4ecK3dTLwVIOfs7NiKwjT1Qz01pP" target="_blank" rel="noopener noreferrer">
          <span class="button-text">انتقل إلى المحاضرات</span>
          <span class="book" aria-hidden="true">📚</span>
          <span class="button-arrow" aria-hidden="true">↗</span>
          <span class="button-shine" aria-hidden="true"></span>
        </a>
        <div class="signature"><span></span><b>m.j.d</b><span></span></div>
      </div>
    </section>
  </main>
</body>
</html>
