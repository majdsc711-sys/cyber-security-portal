<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self'; style-src 'self'; script-src 'none'; connect-src 'none'; font-src 'self'; object-src 'none'; media-src 'none'; worker-src 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#071018">
  <meta name="description" content="بوابة الوصول إلى محاضرات الأمن السيبراني.">
  <title>بوابة الأمن السيبراني | m.j.d</title>
  <link rel="stylesheet" href="styles.css">
</head>
  <body>
  <div class="atmosphere" aria-hidden="true">
    <div class="photo-blur"></div>
    <img class="group-photo" src="class-background.webp" alt="">
    <div class="photo-veil"></div>
    <div class="grid"></div>
    <div class="light light-cyan"></div>
    <div class="light light-amber"></div>
    <img class="ghost-mark" src="emblem.png" alt="">
  </div>

  <main class="page">
    <section class="portal" aria-labelledby="portal-title">
      <div class="emblem-stage" aria-hidden="true">
        <div class="orbit orbit-a"></div>
        <div class="orbit orbit-b"></div>
        <div class="orbit orbit-c"></div>
        <div class="emblem-plaque">
          <span class="scanline"></span>
          <img class="emblem" src="emblem.png" alt="">
        </div>
        <span class="spark spark-a"></span>
        <span class="spark spark-b"></span>
        <span class="spark spark-c"></span>
      </div>

      <div class="access-panel">
        <h1 id="portal-title">للانتقال اضغط</h1>
        <a class="lecture-link" href="https://drive.google.com/drive/folders/18sUd4ecK3dTLwVIOfs7NiKwjT1Qz01pP" target="_blank" rel="noopener noreferrer">
          <span>انتقل إلى المحاضرات</span>
          <span class="book" aria-hidden="true">📚</span>
          <span class="link-arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </section>

    <p class="signature">m.j.d</p>
  </main>
</body>
</html>
