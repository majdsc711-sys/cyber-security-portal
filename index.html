<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071018">
  <title>للانتقال اضغط</title>
  <style>
    :root{color-scheme:dark;--aqua:#64e9df;--blue:#72a7ff;--violet:#af8bff}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#102e3b 0%,#0a1823 35%,#060b14 78%);color:#f4feff;font-family:Tahoma,"Segoe UI",Arial,sans-serif}
    body::before{content:"";position:fixed;inset:-30%;pointer-events:none;background:conic-gradient(from 0deg at 50% 50%,transparent 0 35%,rgba(74,223,221,.055) 43%,transparent 51% 72%,rgba(132,117,255,.045) 80%,transparent 87%);filter:blur(75px);animation:ambient 22s linear infinite}
    main{position:relative;isolation:isolate;width:100%;min-height:100svh;display:grid;place-items:center;padding:22px;perspective:1200px}
    .event-card{position:relative;width:min(84vw,390px);aspect-ratio:1;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(155,242,244,.33);border-radius:30px;background:linear-gradient(145deg,rgba(18,44,59,.76),rgba(11,19,39,.82));box-shadow:0 34px 90px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.12),0 0 46px rgba(55,195,211,.11);backdrop-filter:blur(16px);transform-style:preserve-3d;animation:cardFloat 7s ease-in-out infinite;transition:border-color .35s,box-shadow .35s,transform .35s}
    .event-card::before{content:"";position:absolute;inset:-45%;z-index:-1;background:conic-gradient(from 0deg,transparent 0 72%,rgba(100,233,223,.15) 79%,transparent 86%);filter:blur(22px);animation:ambient 14s linear infinite}
    .event-card::after{content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.065);border-radius:22px;pointer-events:none}
    .logo{position:absolute;z-index:0;left:50%;top:47%;width:72%;height:78%;object-fit:contain;opacity:.92;filter:drop-shadow(0 12px 26px rgba(32,210,218,.18)) drop-shadow(0 8px 18px rgba(0,0,0,.22));transform:translate(-50%,-50%) translateZ(18px);animation:logoDrift 8s ease-in-out infinite;pointer-events:none;user-select:none}
    .copy{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px;text-align:center;transform:translateZ(54px)}
    .prompt{margin:0;color:#f2ffff;font-size:clamp(18px,4.5vw,23px);font-weight:700;line-height:1.6;text-shadow:0 2px 18px rgba(0,0,0,.9)}
    .cta{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:13px 24px;border:1px solid rgba(118,244,235,.78);border-radius:15px;background:linear-gradient(120deg,rgba(26,110,121,.9),rgba(89,79,158,.9));box-shadow:0 10px 30px rgba(28,196,204,.2),inset 0 1px rgba(255,255,255,.2);color:#fff;font-size:clamp(17px,4.3vw,21px);font-weight:800;line-height:1.5;text-decoration:none;text-shadow:0 1px 8px rgba(0,0,0,.35);transition:transform .22s,box-shadow .22s,background .22s}
    .cta:hover,.cta:focus-visible{transform:translateY(-4px) translateZ(8px);background:linear-gradient(120deg,rgba(34,141,150,.98),rgba(111,91,188,.98));box-shadow:0 16px 38px rgba(28,196,204,.35),0 0 22px rgba(121,153,255,.22),inset 0 1px rgba(255,255,255,.28)}
    .cta:focus-visible{outline:2px solid #b9fffb;outline-offset:5px}
    .event-card:has(.cta:hover),.event-card:has(.cta:focus-visible){border-color:rgba(142,255,248,.65);box-shadow:0 38px 100px rgba(0,0,0,.48),0 0 58px rgba(55,195,211,.2),inset 0 1px rgba(255,255,255,.14)}
    @keyframes cardFloat{0%,100%{transform:rotateY(-4deg) rotateX(2deg) translateY(3px)}50%{transform:rotateY(4deg) rotateX(-2deg) translateY(-8px)}}
    @keyframes logoDrift{0%,100%{transform:translate(-50%,-50%) translateZ(18px) rotateY(-5deg) scale(1)}50%{transform:translate(-50%,-52%) translateZ(30px) rotateY(5deg) scale(1.025)}}
    @keyframes ambient{to{transform:rotate(360deg)}}
    @media(max-width:480px){.event-card{width:min(88vw,350px);border-radius:25px}.event-card::after{inset:10px;border-radius:18px}.copy{gap:15px}.logo{width:76%;height:80%}.cta{min-height:50px;padding:11px 19px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main>
    <section class="event-card" aria-label="">
      <img class="logo" src="emblem-hd.png" alt="">
      <div class="copy">
        <p class="prompt">للانتقال اضغط</p>
        <a class="cta" href="https://drive.google.com/drive/folders/18sUd4ecK3dTLwVIOfs7NiKwjT1Qz01pP" target="_blank" rel="noopener noreferrer">الانتقال إلى المحاضرات</a>
      </div>
    </section>
  </main>
</body>
</html>
